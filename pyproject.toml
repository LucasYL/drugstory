[project]
name = "drugstory"
version = "0.10.0"
description = "新药物语：角色养成、药物研发与产业竞争的文字经营游戏"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
drugstory = "drugstory.career.cli:main"
drugstory-web = "drugstory.career.server:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drugstory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
