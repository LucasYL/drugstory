[project]
name = "coding-practice"
version = "0.1.0"
description = "每次 20 分钟，亲手写一个模拟经营游戏"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lemonade = "lemonade.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lemonade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
