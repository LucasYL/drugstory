[project]
name = "drugstory"
version = "0.3.0"
description = "新药物语（暂定名）：开罗式的制药经营游戏"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
drugstory = "drugstory.ui.cli:main"
drugstory-web = "drugstory.ui.web_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drugstory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
