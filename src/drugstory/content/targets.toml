# 靶点：科学标签 + 疾病参数。和 design/content.md 第 1 节是同一份内容。
#
# location  位置：secreted 胞外分泌 / surface 细胞表面 / intracellular 细胞内 / nucleic 基因层面
# pocket    口袋：yes 有 / hard 难 / no 无
# actions   干预：inhibit 抑制 / activate 激活 / deplete 清除 / restore 补上缺失的功能 / immunize 诱导免疫
# tissue    组织：systemic 全身 / liver 肝脏 / cns 中枢 / solid_tumor 实体瘤 / blood 血液肿瘤 / immune 免疫细胞
# unlock    解锁需要的研究数据（开局可用的靶点在 balance.toml 的 [start] 里）
# market    市场规模 1–5 档；trial_cost / trial_time 临床花费和时长系数；difficulty 难度系数
# chronic   是否长期用药；category 结果文案的类型
# sm_suffix 小分子（和降解剂）起名时推荐的后缀，空字符串表示自由命名

