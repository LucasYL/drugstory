# I 期文案：安全性按分数分三档；成药性按给药方式和分数分三档（high ≥ 7，mid 4–6，low ≤ 3）
[phase_one.safety]
high = "未见剂量限制性毒性"
mid = "安全性可以接受，有一些轻度不良反应"
low = "出现严重不良反应，需要大幅降低剂量"

[phase_one.druggability.oral]
high = "半衰期 {hours} 小时，支持每日一次口服"
mid = "口服吸收一般，需要每天服用两次"
low = "口服暴露量不够，药代特性很差"

[phase_one.druggability.injection]
high = "半衰期很长，支持每月一次皮下注射"
mid = "需要每两周注射一次"
low = "清除太快，需要频繁给药"

[phase_one.druggability.infusion]
high = "每三周静脉输注一次即可"
mid = "需要每周静脉输注"
low = "输注反应多，给药很麻烦"

[phase_one.druggability.one_time]
high = "一次给药，效果持久"
mid = "一次给药，持久性还要观察"
low = "表达水平太低，效果维持不住"

[outcomes]
II_pass = "疗效信号明确：{metric}"
II_fail = "疗效信号太弱：{metric}"
III_pass = "主要终点达成：{metric}"
III_fail_efficacy = "未达到主要终点：{metric}"
III_fail_safety = "疗效达标（{metric}），但安全性问题太多"
NDA_pass = "审评通过，准予上市"
NDA_fail = "审评未通过：总分 {total}，{weakest}最弱"
hazard = "{phase}出现「{hazard}」，{stat}专家扣 {severity} 分"

