[hazards.modality.gene_therapy]
safety = ["AAV 引起肝损伤"]
manufacturability = ["病毒载体产量低"]

# 第 5 节 结果文案：数值按分数线性换算，1 分对应 low，10 分对应 high
[results.solid_tumor]
II = { label = "客观缓解率", low = 5, high = 70, unit = "%", decimals = 0 }
III = { label = "死亡风险降低", low = 0, high = 45, unit = "%", decimals = 0 }

[results.heme]
II = { label = "完全缓解率", low = 10, high = 85, unit = "%", decimals = 0 }
III = { label = "疾病进展风险降低", low = 0, high = 60, unit = "%", decimals = 0 }

[results.metabolic]
