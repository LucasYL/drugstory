# 第 6 节 隐患：通用的按属性分，分子类型专属的会和通用的一起抽
[hazards.general]
safety = ["代谢产物有肝毒性", "心脏毒性（hERG 信号）", "骨髓抑制", "致畸风险"]
druggability = ["溶解度太差", "半衰期太短", "口服吸收差", "脱靶效应"]
manufacturability = ["杂质超标", "收率太低", "批次间差异大", "稳定性差"]

[hazards.modality.mab]
safety = ["出现抗药抗体"]
druggability = ["抗体聚集"]

[hazards.modality.adc]
safety = ["载荷脱落导致毒性"]
manufacturability = ["偶联比例不稳定"]

[hazards.modality.peptide]
