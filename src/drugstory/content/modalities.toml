# 分子类型：组合规则用的科学能力 + 数值 + 解锁条件。和 design/content.md 第 2 节是同一份内容。
#
# 科学能力（组合规则见 design/content.md 3.1 节）：
#   enters_cell        能不能进细胞
#   crosses_bbb        能不能过血脑屏障
#   nucleic            能不能作用到基因层面
#   requires_surface   是不是只能打细胞表面的靶点
#   pocket             functional 需要功能口袋 / binder 能结合就行 / none 不需要
#   actions            擅长的干预方式
#   delivery           送得到的组织；空列表表示不受限（做疫苗时也不受限）
#   prefers            擅长的组织，+1
#   sweet_spot         主场：条件全部满足时 +1（location / pocket / action / tissue，可以写成列表）
#   action_bonus_when  干预方式对得上时，还要满足这个条件才 +1，否则算 0
#   blocked_locations  遇到这些位置直接判"很差"
#   location_penalties / tissue_penalties  遇到这些位置或组织时加减分
#
# 数值：base_weeks 研发基础周数；weekly_cost 每周研发花费（万）；trial_cost 临床花费系数；
#       risk 隐患频率 low / medium / high；route 给药方式（oral 才有长期用药的加成）
# 起名：suffix 推荐后缀，空字符串表示用靶点的 sm_suffix
# 解锁：unlock 研究数据；requires_all 全部满足 / requires_any 满足一个就行（[分子类型, 熟练度]）；
#       requires_facility 需要的场地

[[modalities]]
key = "small_molecule"
name = "小分子"
enters_cell = true
crosses_bbb = true
nucleic = false
requires_surface = false
pocket = "functional"
actions = ["inhibit", "activate"]
delivery = []
prefers = []
sweet_spot = { pocket = "yes", reason = "有现成的口袋" }
base_weeks = 30
weekly_cost = 5
trial_cost = 1.0
risk = "medium"
route = "oral"
route_name = "口服"
suffix = ""
unlock = 0

