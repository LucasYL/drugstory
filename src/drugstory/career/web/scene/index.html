<!doctype html>
<html lang="zh-CN">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新药物语 · 一屏研究所</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="scene/style.css" />
    <script src="api-driver.js" defer></script>
    <script src="honors.js" defer></script>
    <script src="projects.js" defer></script>
    <script src="scene/art.js" defer></script>
    <script src="scene/figures.js" defer></script>
    <script src="scene/renderer.js" defer></script>
    <script src="scene/world.js" defer></script>
    <script src="scene/panels.js" defer></script>
    <script src="scene/ui.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body class="scene-page">
    <header class="topbar">
      <a class="brand" href="scene" title="新药物语 v0.11"
        ><span class="brand-mark">药</span><span class="brand-name">新药物语</span></a
      >
      <div id="scene-metrics" class="metrics-bar">连接研究所…</div>
      <div class="clock" role="group" aria-label="时间">
        <button data-speed="0" aria-pressed="true" title="暂停（空格）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="3" width="3" height="10" rx="1" /><rect x="9" y="3" width="3" height="10" rx="1" /></svg
          ><span class="sr">暂停</span>
        </button>
        <button data-speed="1" aria-pressed="false" title="1×（按 1）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l8 5-8 5z" /></svg>1×
        </button>
        <button data-speed="2" aria-pressed="false" title="2×（按 2）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3l6 5-6 5zM8 3l6 5-6 5z" /></svg>2×
        </button>
        <button data-speed="4" aria-pressed="false" title="4×（按 3）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3l5 5-5 5zM6 3l5 5-5 5zM11 3l4 5-4 5z" /></svg>4×
        </button>
        <button data-scene="next" class="next" title="跳到下一件需要你的事（N）">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3l7 5-7 5zM10 3h3v10h-3z" /></svg>下一件事
        </button>
        <span id="clock-status" role="status">连接中</span>
      </div>
      <nav class="topmenu" aria-label="更多">
        <button data-scene="gallery">图鉴</button>
        <button data-scene="help">怎么玩</button>
        <details class="menu">
          <summary aria-label="更多操作">⋯</summary>
          <div>
            <span id="save-status">连接中…</span>
            <a href="text" class="button quiet">文字版</a>
            <a href="api/save" download class="button quiet">导出存档</a>
            <button data-scene="reconnect">重新连接</button>
          </div>
        </details>
      </nav>
    </header>
    <main class="institute">
      <section class="scene-stage" aria-label="可交互研究所">
        <canvas id="scene-canvas" aria-label="点击房间或人物查看详情"></canvas>
        <div id="room-labels"></div>
        <div id="scene-goal" aria-live="polite"></div>
        <div id="scene-toasts" aria-live="polite"></div>
        <div class="legend" aria-hidden="true">
          <span class="make">开发</span><span class="test">验证</span>
        </div>
        <div class="dock">
          <section id="scene-projects" aria-label="项目"></section>
          <section id="scene-people" aria-label="伙伴"></section>
        </div>
      </section>
      <aside class="side">
        <nav class="tabs" aria-label="经营">
          <button data-tab="pipeline">研发<i hidden></i></button
          ><button data-tab="characters">伙伴<i hidden></i></button
          ><button data-tab="services">服务<i hidden></i></button
          ><button data-tab="market">产品</button
          ><button data-tab="competition">对手</button
          ><button data-tab="honors">荣誉</button
          ><button data-tab="journal">复盘</button>
        </nav>
        <div id="app" class="panel"><p class="sub">正在载入进度…</p></div>
        <details class="scene-log">
          <summary>研究所日志</summary>
          <ol id="scene-journal"></ol>
        </details>
      </aside>
    </main>
    <div id="notice" role="alert" hidden></div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-body"></div>
    </dialog>
  </body>
</html>
